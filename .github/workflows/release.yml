name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: Release version in SemVer format, for example v1.2.3
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: macos-26
    steps:
      - name: Prepare release metadata
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          CI_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_VERSION: ${{ inputs.version }}
          MANUAL_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            TAG="v0.1.$CI_RUN_NUMBER"
            SHA="$CI_SHA"
          else
            TAG="$MANUAL_VERSION"
            SHA="$MANUAL_SHA"
          fi

          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.release.outputs.sha }}

      - name: Detect release credentials
        id: credentials
        env:
          CERTIFICATE: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          if [[ -n "$CERTIFICATE" && -n "$P12_PASSWORD" && -n "$KEYCHAIN_PASSWORD" && -n "$SIGNING_IDENTITY" && -n "$APPLE_TEAM_ID" ]]; then
            echo "can_sign=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_sign=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ -n "$CERTIFICATE" && -n "$P12_PASSWORD" && -n "$KEYCHAIN_PASSWORD" && -n "$SIGNING_IDENTITY" && -n "$APPLE_ID" && -n "$APPLE_TEAM_ID" && -n "$APP_PASSWORD" ]]; then
            echo "can_notarize=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_notarize=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import signing certificate
        if: steps.credentials.outputs.can_sign == 'true'
        env:
          CERTIFICATE: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/project-tracking.keychain-db"
          echo "$CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Build release
        env:
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CAN_SIGN: ${{ steps.credentials.outputs.can_sign }}
        run: |
          ARGS=(
            -project "ProjectTracking.xcodeproj"
            -scheme ProjectTracking
            -configuration Release
            -destination 'platform=macOS'
            -derivedDataPath "$RUNNER_TEMP/DerivedData"
          )
          if [[ "$CAN_SIGN" == "true" ]]; then
            xcodebuild "${ARGS[@]}" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" build
          else
            xcodebuild "${ARGS[@]}" CODE_SIGNING_ALLOWED=NO build
          fi

      - name: Notarize and staple app
        if: steps.credentials.outputs.can_notarize == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release/Trace.app"
          ditto -c -k --keepParent "$APP_PATH" "$RUNNER_TEMP/Trace-notarization.zip"
          xcrun notarytool submit "$RUNNER_TEMP/Trace-notarization.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APP_PASSWORD" --wait
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"

      - name: Package DMG and ZIP
        run: |
          chmod +x scripts/package-release.sh
          scripts/package-release.sh "$RUNNER_TEMP/DerivedData/Build/Products/Release/Trace.app" dist

      - name: Notarize and staple DMG
        if: steps.credentials.outputs.can_notarize == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          xcrun notarytool submit dist/Trace.dmg \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APP_PASSWORD" --wait
          xcrun stapler staple dist/Trace.dmg
          xcrun stapler validate dist/Trace.dmg

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          NOTES_FILE=""
          # Описание релиза берётся из releases/<version>.md, если файл
          # закоммичен в релизном коммите; иначе — автогенерация GitHub.
          for candidate in "releases/$VERSION.md" "releases/$RELEASE_TAG.md"; do
            if [[ -f "$candidate" ]]; then
              NOTES_FILE="$candidate"
              break
            fi
          done

          ARGS=(
            --target "$RELEASE_SHA"
            --title "Trace $RELEASE_TAG"
          )
          if [[ -n "$NOTES_FILE" ]]; then
            echo "Using release notes from $NOTES_FILE"
            gh release create "$RELEASE_TAG" dist/Trace.zip dist/Trace.dmg \
              "${ARGS[@]}" --notes-file "$NOTES_FILE"
          else
            echo "releases/$VERSION.md not found, generating notes automatically"
            gh release create "$RELEASE_TAG" dist/Trace.zip dist/Trace.dmg \
              "${ARGS[@]}" --generate-notes
          fi
